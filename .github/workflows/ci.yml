name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  # `test` and `windows` below are REQUIRED status checks on `main`
  # (docs/admin/branch-rulesets.md), so renaming either job wedges every PR:
  # GitHub waits forever for a context that no longer reports. The parity guard
  # is in scripts/ops/check-rulesets.test.ts.
  #
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them. No queue is
  # enabled today — it is unavailable on a user-owned repo, and the ruleset's
  # strict-update policy (branch must be up to date before merge) stands in for
  # it — so this trigger is inert, and kept for the day that changes.
  merge_group:
  # MANUAL DISPATCH, and it is not a convenience.
  #
  # `test` and `windows` are REQUIRED status checks, and the ONLY things that
  # created them were the `push` and `pull_request` events above. When GitHub
  # stops turning those events into workflow runs, every PR in the repo is
  # unmergeable with no lever at all — not a re-run (`gh run rerun` re-runs an
  # existing run at its ORIGINAL head SHA, so it cannot produce checks for a
  # SHA that never had a run), not a re-push (same throttled path), nothing.
  #
  # That is not hypothetical. On 2026-08-06 Actions ran a multi-hour incident in
  # which runners recovered but event->run dispatch stayed throttled: eight open
  # PRs sat with ZERO checks, and `gh workflow run ci.yml` answered
  # `HTTP 422: Workflow does not have 'workflow_dispatch' trigger`.
  #
  # A dispatch is an API call rather than an event, so it does not travel the
  # path that failed. `release-tag-check.yml` gained the same escape hatch for
  # the same reason and in the same week.
  #
  # It takes no inputs on purpose: the ref IS the input (`--ref <branch>`), and
  # a dispatched run reports its check runs against that ref's head commit —
  # which is what a required status check is matched on. So dispatching a PR's
  # head branch satisfies that PR's contexts exactly as a push-triggered run
  # would.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The pinned toolchain image — docs/dev/container-toolchain.md, published by
    # publish-ci-image.yml. Bun and Node are baked in, so this job no longer
    # installs either, and the version it runs is not a function of what
    # bun.sh/install served this morning.
    #
    # `bun-<version>`, NOT the floating `latest` (maximal-core#126). `latest` is
    # shared mutable state across every open PR: republishing it from a bump
    # branch flipped the tag under every OTHER branch at once, and since the
    # first step below asserts the image's Bun equals `.bun-version`, a
    # `.bun-version` bump was mutually exclusive with every in-flight PR — no
    # state existed in which both could be green. Naming the pin's own tag means
    # a branch resolves the image it was written against, and the mismatch lands
    # on the bump PR, whose author is the one person able to fix it.
    #
    # This does NOT reintroduce what publish-ci-image.yml's header rules out.
    # That argument is against COMPUTING the reference: `container.image` is
    # resolved before any step of the job runs, so a computed tag would need a
    # preceding job whose failure would leave this REQUIRED check never
    # reporting. The line below is a committed literal — no preceding job, no
    # `needs:` edge, no step output — so it cannot wedge anything.
    #
    # The bump commit edits this line and `.bun-version` together;
    # scripts/ops/check-ci-image.test.ts fails offline when the two disagree,
    # and the run-time assertion below stays as the real gate. It is also the
    # tag scripts/dev/container.ts already builds, so CI and the local runner
    # finally name the same image the same way.
    #
    # `--user 1001` is the `runner` uid on ubuntu-latest, which owns the
    # workspace, `/github/home` and `/__e` on the host side of every mount the
    # runner makes. It is NOT cosmetic: container jobs are root by default, and
    # tests/config-unwritable-boot.test.ts refuses to run as root because root
    # bypasses DAC and its 0o400 fixture stops being a fixture. Uncontainerised,
    # this job was already `runner`; this keeps it that way.
    container:
      # The tag carries the pin, and it is a LITERAL: it moves in the same
      # commit as `.bun-version`, never on its own. Keep the two in step —
      # scripts/ops/check-ci-image.test.ts enforces that offline.
      image: ghcr.io/${{ github.repository }}/ci:bun-1.3.14
      # GHP packages are private by default regardless of repo visibility, so
      # the pull needs a credential even for the repo that owns the image.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001:1001
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        # NOT redundant, and not cosmetic. Containerising a job silently changes
        # the default shell: uncontainerised, GitHub runs these steps under
        # `bash -e`; inside a container it picks `sh -e`, and dash has no
        # `-o pipefail`. The pin-parity gate below died on its own first line
        # with `set: Illegal option -o pipefail`, exit 2, before it could check
        # anything — a gate that cannot run is worse than no gate, because it
        # reads as a real finding. Naming bash restores the shell this job had
        # before it was containerised. The image carries it.
        shell: bash
    # Backstop against a hung/runaway step (e.g. a poll loop that spins on a
    # blocked network): fail fast in minutes instead of burning the full runner
    # allowance. The whole suite runs well under this locally and in CI.
    timeout-minutes: 20
    steps:
      # The image carries `git`, which is load-bearing here: without it
      # actions/checkout silently falls back to the REST tarball, which has no
      # `.git`, and `bindings:check` compares against the git INDEX.
      - uses: actions/checkout@v6

      - name: Toolchain matches the pin
        # THE PARITY GATE, at run time. The container block above names the
        # pin's own tag, so the two can only disagree if this branch edited one
        # of them and not the other — but that is exactly what a bump does, and
        # nothing in the registry stops a `bun-<version>` tag from having been
        # published from a ref where `.bun-version` said something else. Without
        # this step a stale image runs the suite on the wrong Bun, and because
        # `dist/main.js` is a function of the Bun version
        # (docs/bun-version-policy.md) it would report `bindings:check`
        # staleness with a cause nowhere near the truth.
        #
        # It now fails on the BUMP branch only. Before #126 the same assertion
        # fired on every other open PR the moment the image was republished.
        #
        # If the image for the new pin has not been published at all, the
        # failure is earlier and blunter — container creation dies with
        # `manifest unknown` and no step runs. The ordering step (dispatch
        # publish-ci-image on the bump branch first) is in
        # docs/bun-version-policy.md.
        run: |
          set -euo pipefail
          pinned="$(cat .bun-version)"
          actual="$(bun --version)"
          echo "image bun: $actual · .bun-version: $pinned"
          if [ "$actual" != "$pinned" ]; then
            echo "::error title=ci::The toolchain image carries Bun $actual but .bun-version pins $pinned. Point ci.yml's container.image at ci:bun-$pinned and run the publish-ci-image workflow on this ref. See docs/bun-version-policy.md."
            exit 1
          fi

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      - name: Install dependencies
        run: bun install

      - name: Run fast linter
        # oxlint — the first step of `check:fast`, and it ran in no workflow at
        # all until `ci:check` below was written and named it. `lint:all` is
        # not a superset: nothing disables the ESLint rules oxlint covers, and
        # nothing enables oxlint's in ESLint.
        run: bun run lint:fast

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Downstream contract typecheck
        # Compiles a simulated consumer against the published exports map
        # (maximal-core#4). Nothing else here proves a downstream package can
        # resolve and compile against ./supervisor and ./control-contract —
        # #14 removed `port` from ReadyLine with this whole job green.
        run: bun run typecheck:downstream

      - name: Committed dist is fresh
        # The other half of maximal-core#8. Both dist/lib and dist/main.js are
        # force-tracked so a git-dependency install works with no build step:
        # dist/lib backs the exports map a consumer compiles against, and
        # dist/main.js IS the `bin` a consumer runs. #14 changed
        # src/lib/live/supervisor.ts, nothing regenerated dist/lib, and main
        # shipped new runtime behaviour behind the old `{port, pid}` declaration.
        # The step above proves the published surface COMPILES; this one proves
        # it is the surface src/ actually produces — for the bundle too, where
        # staleness does not mislead a compiler, it silently runs old code.
        #
        # Lives in ci.yml, not its own workflow: it must run on every PR that
        # touches src/**, and a path-filtered workflow that is also a required
        # check never reports in the merge queue. It also reuses the install this
        # job already did.
        #
        # Rebuilds into temp dirs outside the repo and compares against git's
        # INDEX, so dist/ is untouched and no earlier or later rebuild (the
        # Downstream step above, the Build step below) can launder the result.
        run: bun run bindings:check

      - name: Guard boundary casts
        # Fail on a NEW unvalidated any→concrete boundary cast. The known-safe
        # set is annotated in-place with `// casts-keep: <reason>`; see
        # scripts/find-casts.ts.
        run: bun run casts:check

      - name: Run tests
        run: bun test

      - name: Knip (unused files / exports / deps)
        run: bun run knip

      - name: Dependency rules and the circular-dependency ratchet
        # `.dependency-cruiser.cjs` had been in the repo, correct, and invoked by
        # nothing — not check:fast, not check:deep, not any workflow. Its two
        # layering `error` rules (`not-to-test`,
        # `no-route-imports-from-lib-or-services`) do fire and do exit 2; they
        # had simply never been run.
        #
        # `no-circular` used to be `warn`, which never affects depcruise's exit
        # code, so a green step here meant "no layering violation", not "no
        # cycles" — and the standing match count was hand-typed into this comment
        # with nothing checking it. It is now `error`, and `deps:check` runs
        # scripts/check-deps.ts: the standing backlog is a recorded set of
        # cycle-closing imports there, a new one fails this step by name, and
        # fixing one fails until the set is re-recorded. The count lives in that
        # file, generated — do not restate it here.
        run: bun run deps:check

      - name: Check for new copy-paste duplication
        # A down-only ratchet on the SET of `src` file pairs that share
        # copy-pasted code, recorded in scripts/check-dupes.ts; a new pair
        # fails here by name. Not jscpd's own percentage threshold: `src` is
        # 31k lines, so a 40-line function copied into a second file moves it
        # 0.33% -> 0.46%, and any threshold loose enough to be green today
        # swallows the entire class of event this exists to catch.
        run: bun run dupes:check

      - name: Every check:deep step runs in a required CI job
        # The gate against this repo's most-repeated failure shape: a check
        # that exists, is correct, and runs nowhere — `dupes:check` above
        # shipped into check:deep and no workflow, `.dependency-cruiser.cjs`
        # sat uninvoked for months. It expands check:deep and asserts each step
        # is named by a job that is a REQUIRED status check; a step that runs
        # only in a non-required or path-filtered job does not count.
        # scripts/ops/check-ci-coverage.ts holds the exclusions and the reasons.
        run: bun run ci:check

      - name: Build
        run: bun run build

      - name: End-to-end suite, from source
        # seam / feed / lifecycle / replace, run against `src/` rather than a
        # compiled artifact. Until now these four ran in exactly one place: the
        # `windows` job below, against a compiled artifact. So the from-source path — the
        # one `bun run dev` and `bun start` use — was exercised by no workflow,
        # and neither was Linux: a regression in the control seam, the SSE feed,
        # shutdown, or port takeover reached a tag before anything on ubuntu
        # noticed.
        #
        # MEASURED at 9.3s locally, against this job's ~79s and the concurrent
        # `windows` job's ~112s. It costs the merge nothing it was not already
        # waiting on — the same argument that put `bun test` on the Windows leg.
        #
        # After Build, because `e2e:replace` and `e2e:lifecycle` spawn real
        # servers on ephemeral ports, and a failure here should not mask a
        # build failure by short-circuiting ahead of it.
        run: bun run e2e

  windows:
    # Windows exposure for a codebase that ships no Windows artifact of its own.
    #
    # WHAT IT USED TO BE. Until #38 the only Windows in this repo was
    # release-artifacts.yml, which triggered on `push: tags: v*` — so Windows
    # was first exercised AFTER the tag was immutable. That is how v0.4.2
    # shipped with no binaries: #38 replaced `prepare` with an inline shell
    # one-liner using `> /dev/null 2>&1` and `$(…)`, Bun's built-in shell (the
    # only shell for lifecycle scripts on Windows) rejects that form,
    # `bun install` failed outright, the leg died at install, `publish` never
    # ran. Every PR was green, because every PR only ever ran on ubuntu-latest.
    # This job was that leg, run before a tag existed.
    #
    # WHAT IT IS NOW. That pipeline is gone — core delivers through the GitHub
    # Package Registry, not compiled binaries — so there is no release leg left
    # to mirror and the build/verify/e2e-against-the-artifact steps went with
    # it. What survives is the part that was doing the work:
    #
    #   1. `bun install`. THE #38 CHECK, and the whole reason this job predates
    #      the artifacts it used to build. Running the lifecycle scripts under
    #      Bun's Windows shell is what catches a script that shell cannot parse
    #      — on the PR, where it is a one-line fix.
    #   2. `bun test`. `resolveConfigPath`, the secrets file tier, CLI detection
    #      and the atomic JSON writers had ZERO Windows coverage before it, and
    #      its first run here found a Windows-only product bug in the secrets
    #      loader that every green ubuntu run had missed. The SQLite handle leak
    #      (#71) surfaced the same way — as an EBUSY on Windows, where an open
    #      handle locks the file, and as nothing at all on POSIX.
    #
    # STILL WORTH ITS WALL CLOCK. Measured before the strip: checkout 7s,
    # setup-bun 12s, `bun install` 54s, the release leg 16s, `bun test` ~17s,
    # against the concurrent ubuntu `test` job's 79s. Removing the release leg
    # takes ~16s off; the rest was always inside the wall clock the merge was
    # already spending.
    #
    # DO NOT DELETE THIS JOB TO SIMPLIFY. `windows` is a REQUIRED status check
    # (docs/admin/branch-rulesets.md, CHECK_JOBS in scripts/ops/check-rulesets.ts)
    # and check-ci-coverage.readJobs() throws if the id disappears. Removing it
    # leaves every PR waiting forever on a context that never reports, and with
    # no bypass actor that cannot be fixed by pushing.
    #
    # It runs concurrently with `test` and carries no path filter, so it reports
    # in the merge queue like any other check (a path-filtered required check
    # never reports there — see the note on `bindings:check` above).
    #
    # WHAT IT STILL CANNOT CATCH: anything needing a Windows machine you can
    # iterate on. Every Windows defect here has been found by pushing and
    # watching CI — see #90, and #88/#89 alongside it.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Not the Windows default (pwsh): every step here is a bash script. Set
        # per-job so the ubuntu job above keeps GitHub's `bash -e` and does not
        # silently gain `pipefail`.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # `export PATH` in each step rather than relying on the GITHUB_PATH entry
      # setup-bun writes: `$HOME/.bun/bin` under Git-for-Windows bash is a mixed
      # `C:\Users\…/.bun/bin` path. Do not drop these lines.

      - name: Install dependencies
        # THE #38 CHECK. Plain `bun install`, matching the ubuntu job — which
        # means the `prepare` lifecycle script runs, in Bun's built-in Windows
        # shell. A script that shell cannot parse fails here, on the PR.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun install

      - name: Run tests
        # The unit suite, on the platform whose filesystem semantics differ.
        #
        # 22 of 1574 cases failed the first time this ran. All 22 were POSIX
        # assumptions in `tests/**` except one, which was a real product bug on
        # Windows that no other check could have found.
        #
        # 1 case stays skipped on win32, with the reason at its skip site:
        # secrets.test.ts's "refuses a group/world-readable secrets file"
        # fixture cannot be constructed without POSIX mode bits.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun test
