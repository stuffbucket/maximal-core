name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them.
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop against a hung/runaway step (e.g. a poll loop that spins on a
    # blocked network): fail fast in minutes instead of burning the full runner
    # allowance. The whole suite runs well under this locally and in CI.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      # Read Bun from the repo's source of truth (docs/bun-version-policy.md); no
      # hardcoded copy of the version to drift from .bun-version.
      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Downstream contract typecheck
        # Compiles a simulated consumer against the published exports map
        # (maximal-core#4). Nothing else here proves a downstream package can
        # resolve and compile against ./supervisor and ./control-contract —
        # #14 removed `port` from ReadyLine with this whole job green.
        run: bun run typecheck:downstream

      - name: Committed bindings are fresh
        # The other half of maximal-core#8: dist/lib is force-tracked so a
        # git-dependency install resolves the exports map with no build step,
        # which means a consumer compiles against those committed files. #14
        # changed src/lib/live/supervisor.ts, nothing regenerated them, and main
        # shipped new runtime behaviour behind the old `{port, pid}` declaration.
        # The step above proves the published surface COMPILES; this one proves
        # it is the surface src/ actually produces.
        #
        # Lives in ci.yml, not its own workflow: it must run on every PR that
        # touches src/lib/**, and a path-filtered workflow that is also a
        # required check never reports in the merge queue. It also reuses the
        # install this job already did.
        #
        # Rebuilds into a temp dir outside the repo, so dist/ is untouched and
        # later steps see a clean tree.
        run: bun run bindings:check

      - name: Guard boundary casts
        # Fail on a NEW unvalidated any→concrete boundary cast. The known-safe
        # set is annotated in-place with `// casts-keep: <reason>`; see
        # scripts/find-casts.ts.
        run: bun run casts:check

      - name: Run tests
        run: bun test

      - name: Knip (unused files / exports / deps)
        run: bun run knip

      - name: Build
        run: bun run build
