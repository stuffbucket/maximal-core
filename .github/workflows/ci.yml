name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  # `test` and `windows` below are REQUIRED status checks on `main`
  # (docs/admin/branch-rulesets.md), so renaming either job wedges every PR:
  # GitHub waits forever for a context that no longer reports. The parity guard
  # is in scripts/ops/check-rulesets.test.ts.
  #
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them. No queue is
  # enabled today — it is unavailable on a user-owned repo, and the ruleset's
  # strict-update policy (branch must be up to date before merge) stands in for
  # it — so this trigger is inert, and kept for the day that changes.
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop against a hung/runaway step (e.g. a poll loop that spins on a
    # blocked network): fail fast in minutes instead of burning the full runner
    # allowance. The whole suite runs well under this locally and in CI.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      # Read Bun from the repo's source of truth (docs/bun-version-policy.md); no
      # hardcoded copy of the version to drift from .bun-version.
      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install

      - name: Run fast linter
        # oxlint — the first step of `check:fast`, and it ran in no workflow at
        # all until `ci:check` below was written and named it. `lint:all` is
        # not a superset: nothing disables the ESLint rules oxlint covers, and
        # nothing enables oxlint's in ESLint.
        run: bun run lint:fast

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Downstream contract typecheck
        # Compiles a simulated consumer against the published exports map
        # (maximal-core#4). Nothing else here proves a downstream package can
        # resolve and compile against ./supervisor and ./control-contract —
        # #14 removed `port` from ReadyLine with this whole job green.
        run: bun run typecheck:downstream

      - name: Committed dist is fresh
        # The other half of maximal-core#8. Both dist/lib and dist/main.js are
        # force-tracked so a git-dependency install works with no build step:
        # dist/lib backs the exports map a consumer compiles against, and
        # dist/main.js IS the `bin` a consumer runs. #14 changed
        # src/lib/live/supervisor.ts, nothing regenerated dist/lib, and main
        # shipped new runtime behaviour behind the old `{port, pid}` declaration.
        # The step above proves the published surface COMPILES; this one proves
        # it is the surface src/ actually produces — for the bundle too, where
        # staleness does not mislead a compiler, it silently runs old code.
        #
        # Lives in ci.yml, not its own workflow: it must run on every PR that
        # touches src/**, and a path-filtered workflow that is also a required
        # check never reports in the merge queue. It also reuses the install this
        # job already did.
        #
        # Rebuilds into temp dirs outside the repo and compares against git's
        # INDEX, so dist/ is untouched and no earlier or later rebuild (the
        # Downstream step above, the Build step below) can launder the result.
        run: bun run bindings:check

      - name: Guard boundary casts
        # Fail on a NEW unvalidated any→concrete boundary cast. The known-safe
        # set is annotated in-place with `// casts-keep: <reason>`; see
        # scripts/find-casts.ts.
        run: bun run casts:check

      - name: Run tests
        run: bun test

      - name: Knip (unused files / exports / deps)
        run: bun run knip

      - name: Dependency rules and the circular-dependency ratchet
        # `.dependency-cruiser.cjs` had been in the repo, correct, and invoked by
        # nothing — not check:fast, not check:deep, not any workflow. Its two
        # layering `error` rules (`not-to-test`,
        # `no-route-imports-from-lib-or-services`) do fire and do exit 2; they
        # had simply never been run.
        #
        # `no-circular` used to be `warn`, which never affects depcruise's exit
        # code, so a green step here meant "no layering violation", not "no
        # cycles" — and the standing match count was hand-typed into this comment
        # with nothing checking it. It is now `error`, and `deps:check` runs
        # scripts/check-deps.ts: the standing backlog is a recorded set of
        # cycle-closing imports there, a new one fails this step by name, and
        # fixing one fails until the set is re-recorded. The count lives in that
        # file, generated — do not restate it here.
        run: bun run deps:check

      - name: Check for new copy-paste duplication
        # A down-only ratchet on the SET of `src` file pairs that share
        # copy-pasted code, recorded in scripts/check-dupes.ts; a new pair
        # fails here by name. Not jscpd's own percentage threshold: `src` is
        # 31k lines, so a 40-line function copied into a second file moves it
        # 0.33% -> 0.46%, and any threshold loose enough to be green today
        # swallows the entire class of event this exists to catch.
        run: bun run dupes:check

      - name: Every check:deep step runs in a required CI job
        # The gate against this repo's most-repeated failure shape: a check
        # that exists, is correct, and runs nowhere — `dupes:check` above
        # shipped into check:deep and no workflow, `.dependency-cruiser.cjs`
        # sat uninvoked for months. It expands check:deep and asserts each step
        # is named by a job that is a REQUIRED status check; a step that runs
        # only in a non-required or path-filtered job does not count.
        # scripts/ops/check-ci-coverage.ts holds the exclusions and the reasons.
        run: bun run ci:check

      - name: Build
        run: bun run build

      - name: End-to-end suite, from source
        # seam / feed / lifecycle / replace, run against `src/` rather than a
        # compiled artifact. Until now these four ran in exactly one place: the
        # `windows` job below, via `e2e:binary`. So the from-source path — the
        # one `bun run dev` and `bun start` use — was exercised by no workflow,
        # and neither was Linux: a regression in the control seam, the SSE feed,
        # shutdown, or port takeover reached a tag before anything on ubuntu
        # noticed.
        #
        # MEASURED at 9.3s locally, against this job's ~79s and the concurrent
        # `windows` job's ~112s. It costs the merge nothing it was not already
        # waiting on — the same argument that put `bun test` on the Windows leg.
        #
        # After Build, because `e2e:replace` and `e2e:lifecycle` spawn real
        # servers on ephemeral ports, and a failure here should not mask a
        # build failure by short-circuiting ahead of it.
        run: bun run e2e

  windows:
    # The `bun-windows-x64` release leg, run before a tag exists.
    #
    # Until this job, the ONLY Windows exposure in the repo was
    # release-artifacts.yml, which triggers on `push: tags: v*`. So Windows was
    # first exercised AFTER the tag was immutable — which is how v0.4.2 shipped
    # with no binaries: #38 replaced `prepare` with an inline shell one-liner
    # using `> /dev/null 2>&1` and `$(…)`, Bun's built-in shell (the only shell
    # for lifecycle scripts on Windows) rejects that form, `bun install` failed
    # outright, the leg died at install, `publish` never ran. Every PR was
    # green, because every PR only ever ran on ubuntu-latest.
    #
    # This is that leg minus the rename/checksum/upload — same runner, same
    # `bun install`, same three package.json scripts, same order — plus the
    # unit suite appended after it.
    #
    # MEASURED on this repo (job wall clock, all legs concurrent):
    #
    #   ubuntu `test` (the job above)                       79s
    #   windows, checkout + setup-bun + `bun install`       66s
    #   windows, + build:binary + verify:artifact + e2e     95s
    #   windows, + `bun test`                              112s  <- this job
    #
    # Per-step: checkout 7s, setup-bun 12s, `bun install` 54s, the release leg
    # 16s, `bun test` ~17s. Three conclusions the numbers make for us:
    #
    # 1. The install IS the cost, and it is the check — running the lifecycle
    #    scripts under Bun's Windows shell is the whole of what catches #38.
    #    Stopping there would save 16 seconds and give up every build- and
    #    runtime-level Windows failure, including the class #30 and #47 fixed
    #    (`e2e:lifecycle` spawning POSIX `sleep`). 16s is not a reason to ship
    #    a check that only covers the first step of the thing it is proxying.
    #
    # 2. `bun test` adds ~17s on top of that, entirely inside the wall clock
    #    the concurrent ubuntu `test` job already spends. It costs the merge
    #    queue nothing it was not already waiting for.
    #
    # 3. What it buys: `resolveConfigPath`, the secrets file tier, CLI
    #    detection and the atomic JSON writers had ZERO Windows coverage, and
    #    the first `bun test` run here found a Windows-only product bug in the
    #    secrets loader that every green ubuntu run had missed.
    #
    # It runs concurrently with `test` and carries no path filter, so it
    # reports in the merge queue like any other check (a path-filtered required
    # check never reports there — see the note on `bindings:check` above).
    #
    # WHAT THIS STILL CANNOT CATCH: the macOS leg, the second target's compile,
    # and the publish job's rename/checksum/ARTIFACTS.md assembly. Those need
    # the real workflow, and the cheapest way to get them before a tag is a
    # `workflow_dispatch` dry run of release-artifacts.yml (`publish` defaults
    # to false) — now step 2 of docs/release-runbook.md.
    #
    # KEEP IN SYNC with the `bun-windows-x64` leg of release-artifacts.yml. The
    # coupling is via package.json script names rather than copied shell, so a
    # change to what those scripts do reaches both; a change to the leg's step
    # LIST does not, and has to be mirrored here by hand.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Not the Windows default (pwsh) — same reason release-artifacts.yml
        # sets it: every step here is a bash script. Set per-job so the ubuntu
        # job above keeps GitHub's `bash -e` and does not silently gain
        # `pipefail`.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Runner arch matches the release target
        # release-artifacts.yml asserts this for the same reason: a floating
        # `windows-latest` label that changed architecture would turn this into
        # a check of a target we do not ship.
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "runner arch: $actual (expected x86_64)"
          [ "$actual" = "x86_64" ]

      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # `export PATH` in each step rather than relying on the GITHUB_PATH entry
      # setup-bun writes: `$HOME/.bun/bin` under Git-for-Windows bash is a mixed
      # `C:\Users\…/.bun/bin` path, and release-artifacts.yml already exports
      # explicitly on this runner for that reason. Do not drop these lines.

      - name: Install dependencies
        # THE #38 CHECK. Plain `bun install`, matching both the ubuntu job and
        # the release leg — which means the `prepare` lifecycle script runs, in
        # Bun's built-in Windows shell, exactly as it does on a tag. A script
        # that shell cannot parse fails here, on the PR, instead of on the tag.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun install

      - name: Build the Windows artifact
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build:binary -- --target=bun-windows-x64 --out=dist-release/maximal.exe
          ls -l dist-release

      - name: Verify the artifact
        # No `--expect-version`: verify-artifact.ts falls back to
        # package.json's version, which is the right claim on a branch. The tag
        # comparison is release-artifacts.yml's job and needs a tag to exist.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run verify:artifact -- --binary=dist-release/maximal.exe

      - name: End-to-end suite against the artifact
        # #30 and #47 made this leg portable; this is what keeps it that way.
        # Windows has no SIGTERM, so the shutdown assertions here prove the
        # binary is terminable, not that it drained — same asymmetry
        # release-artifacts.yml documents, and not one this job can close.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run e2e:binary -- --binary=dist-release/maximal.exe

      - name: Run tests
        # The unit suite, on the platform we ship a `windows-x64` binary for.
        #
        # Deliberately LAST, after the release leg above and not interleaved
        # with it. Two reasons: the leg's step sequence stays byte-for-byte the
        # shape release-artifacts.yml runs (the KEEP IN SYNC note below is only
        # checkable if nothing is spliced into the middle), and a unit failure
        # can never mask a build/verify/e2e failure by short-circuiting ahead
        # of it.
        #
        # This was absent until now because 22 of 1574 cases failed here. All
        # 22 were POSIX assumptions in `tests/**` except one, which was a real
        # product bug on Windows that no other check could have found — see the
        # PR that added this step.
        #
        # 1 case stays skipped on win32, with the reason at its skip site:
        # secrets.test.ts's "refuses a group/world-readable secrets file"
        # fixture cannot be constructed without POSIX mode bits.
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun test
