name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # See ci.yml — required checks must also run on merge_group.
  merge_group:
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # `.github/codeql/codeql-config.yml` is inert unless it is named here —
          # `init` has no convention that discovers it by path. Without this
          # input the file's `paths-ignore` never applied, so every analysis
          # scanned the force-tracked `dist/` bundle (7.3 MB of inlined
          # dependencies) alongside `src/`. ADR-0001 cites this config as the
          # home for rule-wide exclusions; that claim was only true once the
          # config was actually wired in.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
