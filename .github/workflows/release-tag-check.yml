# Tag tripwire — gate 3: a pushed tag must match package.json's version.
#
# This is the repo's FIRST tag-triggered workflow, and it is deliberately a
# detector rather than a preventer. The preventive placement is the preflight
# `bun run release:check version vX.Y.Z`, wired into docs/release-runbook.md §4
# and run before the push: a published tag is immutable in practice (the runbook
# forbids moving one, because a consumer's bun.lock pins the resolved SHA and
# only `bun update` re-resolves), so by the time a tag-push workflow can see the
# tag, the mismatch has already shipped.
#
# It exists anyway because "a human runs the preflight" is exactly the
# discipline these gates replace, and because this is the only placement that
# can see the tag that was ACTUALLY pushed rather than the one someone meant to
# push. It fires within seconds, while the tag is almost certainly unconsumed
# and can be deleted and re-cut rather than moved. It is not on the release
# COMMIT: `release:manual` bumps and tags in one invocation, so a push-to-main
# check would race the tag push it is meant to precede, and could not name the
# tag anyway. The full argument is in checkTagVersion's doc comment.
#
# Precedent for the failure it catches: `git show v0.1.1:package.json` reads
# `0.1.0`.
#
# Permissions: `contents: read` only — it checks out the tag and compares two
# strings. It writes nothing and needs no token beyond the checkout.
name: release-tag-check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the tag itself, so ./package.json IS the file the tag
      # publishes — which is the whole comparison.
      - uses: actions/checkout@v6

      - name: Read Bun version
        id: bun
        run: |
          set -euo pipefail
          echo "version=$(cat .bun-version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      # No `bun install` and no `gh`: this subcommand reads one local file.
      - name: Tag matches package.json
        run: |
          set -uo pipefail
          bun run scripts/ops/release-gates.ts version "${{ github.ref_name }}"
          code=$?
          case "$code" in
            0) exit 0 ;;
            1) echo "::error title=release-tag-check::Tag ${{ github.ref_name }} does not match package.json. Delete and re-cut the tag NOW, while it is still unconsumed — do not move a tag anyone may already have resolved."; exit 1 ;;
            *) echo "::warning title=release-tag-check::The check could not run (exit $code); not failing the tag on the gate's own bug."; exit 0 ;;
          esac
