[test]
# `bun test` runs ONLY tests/**. This is what keeps scripts/ops/** out of the
# product suite: that tooling has its own colocated tests, its own bunfig
# (scripts/ops/bunfig.toml, root = "."), and its own lane (`bun run test:ops`,
# run by tooling-ci.yml and release-gates.yml). Drop this and `bun test` would
# swallow the ops suite into the product gate.
root = "tests"
# Redirect COPILOT_API_HOME to a temp dir before any module loads, so no test
# reads/writes the developer's real ~/.local/share/maximal data. See test-setup.ts.
preload = ["./tests/test-setup.ts"]
